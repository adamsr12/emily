	} table {
		border-collapse: collapse;

		width: 516px;
		margin: 0 auto;
		display: grid;
		grid-template: auto / repeat(3,auto);
		justify-content: center;
	} li {

	} a {
		text-decoration: none;
		color: black;
	} a li:hover {
		background: rgba(156,213,231,0.85);

	}
</style>
