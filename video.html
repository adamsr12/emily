<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Video</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Lora:wght@400;500;700&display=swap"
rel="stylesheet">
<style>
	h1 {
		font: 48pt/1.4em 'Cinzel Decorative';
		text-align: center;
		text-shadow: 2px 3px 6px rgba(156,213,231,1.00);
	} ul {
		width: 516px;
		margin: 0 auto;
		display: grid;
		grid-template: auto / repeat(3,auto);
	} li {
		width: 160px;
		height: 50px;
		list-style: none;
		font: 14pt/2.5em Lora;
		text-align: center;
		background: rgba(156,213,231,1.00);
		border-radius: 12px;
		margin: 6px;
	} a {
		text-decoration: none;
		color: black;
	} a li:hover {
		background: rgba(156,213,231,0.85);
		box-shadow: 1px 2px 3px darkgray;
	} video {
		width: 640px;
		height: auto;
		display: block;
		margin: 72px auto;
	}
</style>
</head>
<body>
	<h1>Welcome</h1>
	<ul>
		<li>Video</li>
		<a href="portfolio-flex.html"><li>Flexbox Portfolio</li>
		</a>
		<li>Grid Portfolio</li>
	</ul>
	<video controls poster="welcome-poster.jpg">
		<source src="welcome.mp4" />
	</video>
</body>
</html>
