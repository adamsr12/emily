	} figure {
		width: 200px;

	} img {

	} figcaption {
		font: italic 12pt/1.4em Lora;

	} table {
		border-collapse: collapse;
		margin: 72px auto;
		border: 1px solid gray;
		background: rgba(156,213,231,0.25);
		font: 14pt/1.4em Lora;
	} td, th {
		padding: 6px 18px;
	} tr:nth-child(odd) {
		background: rgba(156,213,231,0.20);
	} 
</style>
